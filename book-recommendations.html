  <link rel="stylesheet" href="styles.css">

  <style>
    .book-tab-bar {
      display: flex;
      border-bottom: 1.5px solid #e0e0e0;
      margin-bottom: 2rem;
      gap: 0;
    }
    .book-tab-btn {
      background: transparent;
      border: none;
      padding: 10px 24px 10px 0;
      font-size: 16px;
      cursor: pointer;
      color: #888;
      position: relative;
      font-family: inherit;
      transition: color 0.18s ease;
    }
    .book-tab-btn:hover {
      color: #444;
    }
    .book-tab-btn.active {
      color: #111;
      font-weight: 500;
    }
    .book-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1.5px;
      left: 0;
      right: 0;
      height: 2px;
      background: #111;
      border-radius: 2px 2px 0 0;
    }
    .book-tab-panel {
      display: none;
    }
    .book-tab-panel.active {
      display: block;
    }
    .recommendation-credit {
      display: block;
      font-size: 0.85em;
      color: #666;
      margin-top: 4px;
      line-height: 1.4;
    }
    .recommendation-credit a {
      display: inline;
      color: inherit;
      text-decoration: underline;
    }
    .recommendation-credit a:hover {
      color: #111;
    }
  </style>
</head>
